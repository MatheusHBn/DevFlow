
name: DevFlow CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify Maven project
        run: mvn -B -ntp clean verify

  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.16.6'

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive terraform

      - name: Initialize and validate Dev
        run: |
          terraform -chdir=terraform/environments/dev init -backend=false -input=false -lockfile=readonly
          terraform -chdir=terraform/environments/dev validate

      - name: Initialize and validate Prod
        run: |
          terraform -chdir=terraform/environments/prod init -backend=false -input=false -lockfile=readonly
          terraform -chdir=terraform/environments/prod validate

  terraform-plan:
    name: Terraform Plan AWS
    runs-on: ubuntu-latest
    timeout-minutes: 20

    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch')

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.16.6'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::174302433598:role/DevFlow-GitHub-Terraform-Plan
          aws-region: sa-east-1
          allowed-account-ids: '174302433598'

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Initialize Terraform
        run: terraform -chdir=terraform/environments/dev init -input=false -lockfile=readonly

      - name: Terraform Plan
        run: terraform -chdir=terraform/environments/dev plan -input=false -lock-timeout=60s -no-color