
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: devflow

spec:
  replicas: 1

  selector:
    matchLabels:
      app: notification-service

  template:
    metadata:
      labels:
        app: notification-service

    spec:
      containers:
        - name: notification-service
          image: ghcr.io/matheushbn/devflow-notification-service:v2.10.0
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8082

          envFrom:
            - secretRef:
                name: devflow-app-env

          env:
            - name: SERVER_PORT
              value: "8082"

            - name: SERVER_ADDRESS
              value: "0.0.0.0"

            - name: NOTIFICATION_DB_URL
              value: "jdbc:postgresql://postgres:5432/notification_db"

            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"

          resources:
            requests:
              cpu: "150m"
              memory: "192Mi"
            limits:
              cpu: "750m"
              memory: "768Mi"

          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 48

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: devflow

spec:
  type: ClusterIP

  selector:
    app: notification-service

  ports:
    - port: 8082
      targetPort: 8082
