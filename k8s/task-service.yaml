
apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-service
  namespace: devflow

spec:
  replicas: 1

  selector:
    matchLabels:
      app: task-service

  template:
    metadata:
      labels:
        app: task-service

    spec:
      containers:
        - name: task-service
          image: devflow-task-service:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8081

          envFrom:
            - secretRef:
                name: devflow-app-env

          env:
            - name: SERVER_PORT
              value: "8081"

            - name: SERVER_ADDRESS
              value: "0.0.0.0"

            - name: TASK_DB_URL
              value: "jdbc:postgresql://postgres:5432/task_db"

            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"

          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 48

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: task-service
  namespace: devflow

spec:
  type: ClusterIP

  selector:
    app: task-service

  ports:
    - port: 8081
      targetPort: 8081
