
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-service
  namespace: devflow

spec:
  replicas: 1

  selector:
    matchLabels:
      app: audit-service

  template:
    metadata:
      labels:
        app: audit-service

    spec:
      containers:
        - name: audit-service
          image: devflow-audit-service:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8083

          envFrom:
            - secretRef:
                name: devflow-app-env

          env:
            - name: SERVER_PORT
              value: "8083"

            - name: SERVER_ADDRESS
              value: "0.0.0.0"

            - name: AUDIT_DB_URL
              value: "jdbc:postgresql://postgres:5432/audit_db"

            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"

          resources:
            requests:
              cpu: "150m"
              memory: "192Mi"
            limits:
              cpu: "750m"
              memory: "768Mi"

          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 48

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8083
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: audit-service
  namespace: devflow

spec:
  type: ClusterIP

  selector:
    app: audit-service

  ports:
    - port: 8083
      targetPort: 8083
