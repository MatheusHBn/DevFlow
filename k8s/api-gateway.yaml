
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: devflow

spec:
  replicas: 1

  selector:
    matchLabels:
      app: api-gateway

  template:
    metadata:
      labels:
        app: api-gateway

    spec:
      containers:
        - name: api-gateway
          image: devflow-api-gateway:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080

          envFrom:
            - secretRef:
                name: devflow-app-env

          env:
            - name: SERVER_PORT
              value: "8080"

            - name: SERVER_ADDRESS
              value: "0.0.0.0"

            - name: TASK_SERVICE_URL
              value: "http://task-service:8081"

            - name: NOTIFICATION_SERVICE_URL
              value: "http://notification-service:8082"

            - name: AUDIT_SERVICE_URL
              value: "http://audit-service:8083"

            - name: AUTH_SERVICE_URL
              value: "http://auth-service:8084"

          resources:
            requests:
              cpu: "150m"
              memory: "192Mi"
            limits:
              cpu: "750m"
              memory: "768Mi"

          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 48

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: devflow

spec:
  type: ClusterIP

  selector:
    app: api-gateway

  ports:
    - port: 8080
      targetPort: 8080
