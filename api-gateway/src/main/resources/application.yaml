server:
  port: ${SERVER_PORT:8080}
  address: ${SERVER_ADDRESS:127.0.0.1}

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: task-service
              uri: ${TASK_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/v1/tasks/**

            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/v1/notifications/**

            - id: audit-service
              uri: ${AUDIT_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/v1/audits/**

            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/v1/auth/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never

jwt:
  secret: ${JWT_SECRET}