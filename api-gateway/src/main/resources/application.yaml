server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:

            - id: task-service
              uri: http://localhost:8081
              predicates:
                - Path=/v1/tasks/**

            - id: notification-service
              uri: http://localhost:8082
              predicates:
                - Path=/v1/notifications/**

            - id: audit-service
              uri: http://localhost:8083
              predicates:
                - Path=/v1/audits/**

jwt:
  secret: ${JWT_SECRET}