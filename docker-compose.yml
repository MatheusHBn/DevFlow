services:
  postgres:
    image: postgres:17
    container_name: devflow-postgres
    environment:
      POSTGRES_DB: task_db
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - devflow

  kafka:
    image: apache/kafka:4.0.1
    container_name: devflow-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT_HOST://:9092,PLAINTEXT_DOCKER://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT_DOCKER://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT_HOST:PLAINTEXT,PLAINTEXT_DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_DOCKER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    networks:
      - devflow

  task-service:
    build:
      context: ./task-service
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      SERVER_PORT: 8081
      SERVER_ADDRESS: 0.0.0.0
      TASK_DB_URL: jdbc:postgresql://postgres:5432/task_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - devflow
    restart: unless-stopped

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      SERVER_PORT: 8082
      SERVER_ADDRESS: 0.0.0.0
      NOTIFICATION_DB_URL: jdbc:postgresql://postgres:5432/notification_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - devflow
    restart: unless-stopped

  audit-service:
    build:
      context: ./audit-service
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      SERVER_PORT: 8083
      SERVER_ADDRESS: 0.0.0.0
      AUDIT_DB_URL: jdbc:postgresql://postgres:5432/audit_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - devflow
    restart: unless-stopped

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      SERVER_PORT: 8084
      SERVER_ADDRESS: 0.0.0.0
      AUTH_DB_URL: jdbc:postgresql://postgres:5432/devflow_auth
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - devflow
    restart: unless-stopped

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      SERVER_PORT: 8080
      SERVER_ADDRESS: 0.0.0.0
      TASK_SERVICE_URL: http://task-service:8081
      NOTIFICATION_SERVICE_URL: http://notification-service:8082
      AUDIT_SERVICE_URL: http://audit-service:8083
      AUTH_SERVICE_URL: http://auth-service:8084
    ports:
      - "8080:8080"
    depends_on:
      - task-service
      - notification-service
      - audit-service
      - auth-service
    networks:
      - devflow
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  devflow:
    driver: bridge
