services:
  postgres:
    image: postgres:17
    container_name: devflow-postgres
    environment:
      POSTGRES_DB: task_db
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - devflow

  kafka:
    image: apache/kafka:4.0.1
    container_name: devflow-kafka
    ports:
      - "9092:9092"
      - "9404:9404"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT_HOST://:9092,PLAINTEXT_DOCKER://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT_DOCKER://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT_HOST:PLAINTEXT,PLAINTEXT_DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_DOCKER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_OPTS: "-javaagent:/opt/kafka/libs/jmx_prometheus_javaagent.jar=9404:/opt/kafka/config/kafka-config.yml"
    volumes:
      - devflow_kafka_data:/tmp/kafka-logs
      - ./docker/kafka-exporter/jmx_prometheus_javaagent.jar:/opt/kafka/libs/jmx_prometheus_javaagent.jar:ro
      - ./docker/kafka-exporter/kafka-config.yml:/opt/kafka/config/kafka-config.yml:ro
    networks:
      - devflow

  task-service:
    build:
      context: ./task-service
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      SERVER_PORT: 8081
      SERVER_ADDRESS: 0.0.0.0
      TASK_DB_URL: jdbc:postgresql://postgres:5432/task_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - devflow
    restart: unless-stopped

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      SERVER_PORT: 8082
      SERVER_ADDRESS: 0.0.0.0
      NOTIFICATION_DB_URL: jdbc:postgresql://postgres:5432/notification_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - devflow
    restart: unless-stopped

  audit-service:
    build:
      context: ./audit-service
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      SERVER_PORT: 8083
      SERVER_ADDRESS: 0.0.0.0
      AUDIT_DB_URL: jdbc:postgresql://postgres:5432/audit_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - devflow
    restart: unless-stopped

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      SERVER_PORT: 8084
      SERVER_ADDRESS: 0.0.0.0
      AUTH_DB_URL: jdbc:postgresql://postgres:5432/devflow_auth
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - devflow
    restart: unless-stopped

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      SERVER_PORT: 8080
      SERVER_ADDRESS: 0.0.0.0
      TASK_SERVICE_URL: http://task-service:8081
      NOTIFICATION_SERVICE_URL: http://notification-service:8082
      AUDIT_SERVICE_URL: http://audit-service:8083
      AUTH_SERVICE_URL: http://auth-service:8084
    ports:
      - "8080:8080"
    depends_on:
      - task-service
      - notification-service
      - audit-service
      - auth-service
    networks:
      - devflow
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.7.3
    ports:
       - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    depends_on:
       - task-service
       - notification-service
       - audit-service
       - auth-service
       - api-gateway
    networks:
      - devflow
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.2.0
    ports:
      - "3000:3000"
    environment:
       GF_SECURITY_ADMIN_USER: admin
       GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-devflow-local-admin}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - devflow
    restart: unless-stopped

volumes:
  postgres_data:
  grafana_data:
  devflow_kafka_data:
    external: true

networks:
  devflow:
    driver: bridge
